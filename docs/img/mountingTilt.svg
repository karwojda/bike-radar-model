<polyline points="147,70 440,70" fill="none" stroke="#000000"/>
<text x="293.5" y="91" text-anchor="middle" font-size="11" font-style="italic">attributes</text>
<text x="157" y="107" text-anchor="start" font-size="12" font-style="italic">^activePower default 0.96 [W]</text>
<text x="157" y="123" text-anchor="start" font-size="12" font-style="italic">^bandMaxEirp default 0.1 [W]</text>
<text x="157" y="139" text-anchor="start" font-size="12" font-style="italic">^bandMaxOutputPower default 0.01 [W]</text>
<text x="157" y="155" text-anchor="start" font-size="12" font-style="italic">^boardMass default 5 [g]</text>
<text x="157" y="171" text-anchor="start" font-size="12" font-style="italic">^chipTxPower default 0.0126 [W]</text>
<text x="157" y="187" text-anchor="start" font-size="12" font-style="italic">^chirpDuration default 0.00004 [s]</text>
<text x="157" y="203" text-anchor="start" font-size="12" font-style="italic">^chirpsPerFrame default 221</text>
<text x="157" y="219" text-anchor="start" font-size="12" font-style="italic">^frequency default 60500000000.0 [Hz]</text>
<text x="157" y="235" text-anchor="start" font-size="12" font-style="italic">^idlePower default 0.011 [W]</text>
<text x="157" y="251" text-anchor="start" font-size="12" font-style="italic">^maxIfBandwidth default 5000000.0 [Hz]</text>
<text x="157" y="267" text-anchor="start" font-size="12" font-style="italic">^noiseFigure default 12.6</text>
<text x="157" y="283" text-anchor="start" font-size="12" font-style="italic">^processingPower default 0.159 [W]</text>
<text x="157" y="299" text-anchor="start" font-size="12" font-style="italic">^rxChannels default 3</text>
<text x="157" y="315" text-anchor="start" font-size="12" font-style="italic">^activeTime:DurationValue default</text>
<text x="157" y="331" text-anchor="start" font-size="12">  chirpsPerFrame * chirpPeriod</text>
<text x="157" y="347" text-anchor="start" font-size="12" font-style="italic">^antennaArea:AreaValue default (1 +</text>
<text x="157" y="363" text-anchor="start" font-size="12">  rxChannels) * txGain * wavelength **</text>
<text x="157" y="379" text-anchor="start" font-size="12">  2 / (4 * pi * apertureEfficiency)</text>
<text x="157" y="395" text-anchor="start" font-size="12" font-style="italic">^antennaArealMass:ScalarQuantityValue</text>
<text x="157" y="411" text-anchor="start" font-size="12">  default 3 [kg / m ** 2]</text>
<text x="157" y="427" text-anchor="start" font-size="12" font-style="italic">^apertureEfficiency:Real default 0.6</text>
<text x="157" y="443" text-anchor="start" font-size="12" font-style="italic">^azimuthBeamwidth:AngularMeasureValue</text>
<text x="157" y="459" text-anchor="start" font-size="12">  default 60 ['°']</text>
<text x="157" y="475" text-anchor="start" font-size="12" font-style="italic">^chirpIdleTime:DurationValue default</text>
<text x="157" y="491" text-anchor="start" font-size="12">  7e-6 [s]</text>
<text x="157" y="507" text-anchor="start" font-size="12" font-style="italic">^chirpPeriod:DurationValue default</text>
<text x="157" y="523" text-anchor="start" font-size="12">  chirpDuration + chirpIdleTime</text>
<text x="157" y="539" text-anchor="start" font-size="12" font-style="italic">^designTargetRcs:AreaValue default</text>
<text x="157" y="555" text-anchor="start" font-size="12">  10 [m ** 2]</text>
<text x="157" y="571" text-anchor="start" font-size="12" font-style="italic">^detectionRange:LengthValue default</text>
<text x="157" y="587" text-anchor="start" font-size="12">  DetectionRange(self, designTargetRcs)</text>
<text x="157" y="603" text-anchor="start" font-size="12" font-style="italic">^eirp:PowerValue default txPower *</text>
<text x="157" y="619" text-anchor="start" font-size="12">  txGain</text>
<text x="157" y="635" text-anchor="start" font-size="12" font-style="italic">^elevationBeamwidth:AngularMeasureValue</text>
<text x="157" y="651" text-anchor="start" font-size="12">  default 20 ['°']</text>
<text x="157" y="667" text-anchor="start" font-size="12" font-style="italic">^framePeriod:DurationValue default</text>
<text x="157" y="683" text-anchor="start" font-size="12">  0.1 [s]</text>
<text x="157" y="699" text-anchor="start" font-size="12" font-style="italic">^ifLimitedRange:LengthValue default</text>
<text x="157" y="715" text-anchor="start" font-size="12">  maxIfBandwidth * speedOfLight *</text>
<text x="157" y="731" text-anchor="start" font-size="12">  chirpDuration / (2 * sweepBandwidth)</text>
<text x="157" y="747" text-anchor="start" font-size="12" font-style="italic">^losses:Real default 10.0</text>
<text x="157" y="763" text-anchor="start" font-size="12" font-style="italic">^mass:MassValue default boardMass +</text>
<text x="157" y="779" text-anchor="start" font-size="12">  antennaArea * antennaArealMass</text>
<text x="157" y="795" text-anchor="start" font-size="12" font-style="italic">^maxClosingSpeed:SpeedValue default</text>
<text x="157" y="811" text-anchor="start" font-size="12">  wavelength / (2 * chirpPeriod)</text>
<text x="157" y="827" text-anchor="start" font-size="12" font-style="italic">^minSnr:Real default 31.6</text>
<text x="157" y="843" text-anchor="start" font-size="12" font-style="italic">^observationTime:DurationValue default</text>
<text x="157" y="859" text-anchor="start" font-size="12">  chirpsPerFrame * chirpDuration</text>
<text x="157" y="875" text-anchor="start" font-size="12" font-style="italic">^power:PowerValue default (activePower *</text>
<text x="157" y="891" text-anchor="start" font-size="12">  activeTime + processingPower *</text>
<text x="157" y="907" text-anchor="start" font-size="12">  processingTime + idlePower *</text>
<text x="157" y="923" text-anchor="start" font-size="12">  (framePeriod - activeTime -</text>
<text x="157" y="939" text-anchor="start" font-size="12">  processingTime)) / framePeriod</text>
<text x="157" y="955" text-anchor="start" font-size="12" font-style="italic">^processingTime:DurationValue default</text>
<text x="157" y="971" text-anchor="start" font-size="12">  0.01 [s]</text>
<text x="157" y="987" text-anchor="start" font-size="12" font-style="italic">^rangeResolution:LengthValue default</text>
<text x="157" y="1003" text-anchor="start" font-size="12">  speedOfLight / (2 * sweepBandwidth)</text>
<text x="157" y="1019" text-anchor="start" font-size="12" font-style="italic">^rxGain:Real default 25.0</text>
<text x="157" y="1035" text-anchor="start" font-size="12" font-style="italic">^speedResolution:SpeedValue default</text>
<text x="157" y="1051" text-anchor="start" font-size="12">  wavelength / (2 * activeTime)</text>
<text x="157" y="1067" text-anchor="start" font-size="12" font-style="italic">^sweepBandwidth:FrequencyValue default</text>
<text x="157" y="1083" text-anchor="start" font-size="12">  150000000.0 [Hz]</text>
<text x="157" y="1099" text-anchor="start" font-size="12" font-style="italic">^txGain:Real default 25.0</text>
<text x="157" y="1115" text-anchor="start" font-size="12" font-style="italic">^txPower:PowerValue default</text>
<text x="157" y="1131" text-anchor="start" font-size="12">  LowerOf(LowerOf(chipTxPower,</text>
<text x="157" y="1147" text-anchor="start" font-size="12">  bandMaxOutputPower), bandMaxEirp /</text>
<text x="157" y="1163" text-anchor="start" font-size="12">  txGain)</text>
<text x="157" y="1179" text-anchor="start" font-size="12" font-style="italic">^wavelength:LengthValue default</text>
<text x="157" y="1195" text-anchor="start" font-size="12">  speedOfLight / frequency</text>
