<svg xmlns="http://www.w3.org/2000/svg" width="340" height="1877" viewBox="0 0 340 1877" font-family="sans-serif">
<rect x="0" y="0" width="340" height="1877" fill="#ffffff"/>
<rect x="20" y="20" width="300" height="1837" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="170" y="42" text-anchor="middle" font-size="12">«part»</text>
<text x="170" y="60" text-anchor="middle" font-size="14">rearUnit:RearUnitDesign</text>
<polyline points="20,70 320,70" fill="none" stroke="#000000"/>
<text x="170" y="91" text-anchor="middle" font-size="11" font-style="italic">attributes</text>
<text x="30" y="107" text-anchor="start" font-size="12" font-style="italic">^alertLatency = mcu.alertLatency</text>
<text x="30" y="123" text-anchor="start" font-size="12" font-style="italic">^chargeTime = Runtime(battery.energy,</text>
<text x="30" y="139" text-anchor="start" font-size="12">  powerManager.chargePower) *</text>
<text x="30" y="155" text-anchor="start" font-size="12">  powerManager.constantVoltageStretch</text>
<text x="30" y="171" text-anchor="start" font-size="12" font-style="italic">^dayFlashPower:PowerValue =</text>
<text x="30" y="187" text-anchor="start" font-size="12">  radarOnlyPower + leds.dayFlashPower /</text>
<text x="30" y="203" text-anchor="start" font-size="12">  ledDriver.efficiency</text>
<text x="30" y="219" text-anchor="start" font-size="12" font-style="italic">^daylightVisibility =</text>
<text x="30" y="235" text-anchor="start" font-size="12">  leds.daylightVisibility</text>
<text x="30" y="251" text-anchor="start" font-size="12" font-style="italic">^detectionRange =</text>
<text x="30" y="267" text-anchor="start" font-size="12">  TiltedDetectionRange(radarModule,</text>
<text x="30" y="283" text-anchor="start" font-size="12">  radarModule.designTargetRcs,</text>
<text x="30" y="299" text-anchor="start" font-size="12">  worstCaseTilt)</text>
<text x="30" y="315" text-anchor="start" font-size="12" font-style="italic">^mass = radarModule.mass + mcu.mass +</text>
<text x="30" y="331" text-anchor="start" font-size="12">  button.mass + ledDriver.mass +</text>
<text x="30" y="347" text-anchor="start" font-size="12">  leds.mass + radarCoreBuck.mass +</text>
<text x="30" y="363" text-anchor="start" font-size="12">  radarIoBuck.mass + battery.mass +</text>
<text x="30" y="379" text-anchor="start" font-size="12">  powerManager.mass +</text>
<text x="30" y="395" text-anchor="start" font-size="12">  usbCReceptacle.mass + enclosure.mass +</text>
<text x="30" y="411" text-anchor="start" font-size="12">  clamp.mass</text>
<text x="30" y="427" text-anchor="start" font-size="12" font-style="italic">^maxClosingSpeed =</text>
<text x="30" y="443" text-anchor="start" font-size="12">  radarModule.maxClosingSpeed</text>
<text x="30" y="459" text-anchor="start" font-size="12" font-style="italic">^maxOperatingTemperature =</text>
<text x="30" y="475" text-anchor="start" font-size="12">  battery.maxDischargeTemperature</text>
<text x="30" y="491" text-anchor="start" font-size="12" font-style="italic">^maxSeatpostDiameter = clamp.maxDiameter</text>
<text x="30" y="507" text-anchor="start" font-size="12" font-style="italic">^maxTrackedVehicles =</text>
<text x="30" y="523" text-anchor="start" font-size="12">  mcu.maxTrackedVehicles</text>
<text x="30" y="539" text-anchor="start" font-size="12" font-style="italic">^minOperatingTemperature =</text>
<text x="30" y="555" text-anchor="start" font-size="12">  battery.minDischargeTemperature</text>
<text x="30" y="571" text-anchor="start" font-size="12" font-style="italic">^minSeatpostDiameter = clamp.minDiameter</text>
<text x="30" y="587" text-anchor="start" font-size="12" font-style="italic">^nightSolidPower:PowerValue =</text>
<text x="30" y="603" text-anchor="start" font-size="12">  radarOnlyPower + leds.nightSolidPower</text>
<text x="30" y="619" text-anchor="start" font-size="12">  / ledDriver.efficiency</text>
<text x="30" y="635" text-anchor="start" font-size="12" font-style="italic">^radarEirp = radarModule.eirp</text>
<text x="30" y="651" text-anchor="start" font-size="12" font-style="italic">^radarMaxEirp = radarModule.bandMaxEirp</text>
<text x="30" y="667" text-anchor="start" font-size="12" font-style="italic">^radarMaxOutputPower =</text>
<text x="30" y="683" text-anchor="start" font-size="12">  radarModule.bandMaxOutputPower</text>
<text x="30" y="699" text-anchor="start" font-size="12" font-style="italic">^radarOnlyPower:PowerValue =</text>
<text x="30" y="715" text-anchor="start" font-size="12">  radarModule.power /</text>
<text x="30" y="731" text-anchor="start" font-size="12">  radarCoreBuck.efficiency + mcu.power /</text>
<text x="30" y="747" text-anchor="start" font-size="12">  powerManager.mcuRailEfficiency</text>
<text x="30" y="763" text-anchor="start" font-size="12" font-style="italic">^radarOutputPower = radarModule.txPower</text>
<text x="30" y="779" text-anchor="start" font-size="12" font-style="italic">^rangeResolution =</text>
<text x="30" y="795" text-anchor="start" font-size="12">  radarModule.rangeResolution</text>
<text x="30" y="811" text-anchor="start" font-size="12" font-style="italic">^riderSag:AngularMeasureValue default</text>
<text x="30" y="827" text-anchor="start" font-size="12">  2 ['°']</text>
<text x="30" y="843" text-anchor="start" font-size="12" font-style="italic">^runtimeDayFlash =</text>
<text x="30" y="859" text-anchor="start" font-size="12">  Runtime(battery.usableEnergy,</text>
<text x="30" y="875" text-anchor="start" font-size="12">  dayFlashPower)</text>
<text x="30" y="891" text-anchor="start" font-size="12" font-style="italic">^runtimeNightSolid =</text>
<text x="30" y="907" text-anchor="start" font-size="12">  Runtime(battery.usableEnergy,</text>
<text x="30" y="923" text-anchor="start" font-size="12">  nightSolidPower)</text>
<text x="30" y="939" text-anchor="start" font-size="12" font-style="italic">^speedResolution =</text>
<text x="30" y="955" text-anchor="start" font-size="12">  radarModule.speedResolution</text>
<text x="30" y="971" text-anchor="start" font-size="12" font-style="italic">^worstCaseTilt:AngularMeasureValue =</text>
<text x="30" y="987" text-anchor="start" font-size="12">  clamp.aimError + clamp.slipAngle +</text>
<text x="30" y="1003" text-anchor="start" font-size="12">  riderSag</text>
<polyline points="20,1013 320,1013" fill="none" stroke="#000000"/>
<text x="170" y="1034" text-anchor="middle" font-size="11" font-style="italic">assert constraints</text>
<text x="30" y="1050" text-anchor="start" font-size="12" font-style="italic">^{2 * radarModule.framePeriod &lt;=</text>
<text x="30" y="1066" text-anchor="start" font-size="12">  mcu.alertLatency} ✓</text>
<text x="30" y="1082" text-anchor="start" font-size="12" font-style="italic">^{nightSolidPower &lt;=</text>
<text x="30" y="1098" text-anchor="start" font-size="12">  battery.maxDischargePower} ✓</text>
<text x="30" y="1114" text-anchor="start" font-size="12" font-style="italic">^{mcu.peakCurrent &lt;=</text>
<text x="30" y="1130" text-anchor="start" font-size="12">  powerManager.mcuRailMaxCurrent} ✓</text>
<text x="30" y="1146" text-anchor="start" font-size="12" font-style="italic">^{radarModule.corePeakCurrent &lt;=</text>
<text x="30" y="1162" text-anchor="start" font-size="12">  radarCoreBuck.maxOutputCurrent and</text>
<text x="30" y="1178" text-anchor="start" font-size="12">  radarModule.ioPeakCurrent &lt;=</text>
<text x="30" y="1194" text-anchor="start" font-size="12">  radarIoBuck.maxOutputCurrent} ✓</text>
<text x="30" y="1210" text-anchor="start" font-size="12" font-style="italic">^{radarCoreBuck.outputVoltage ==</text>
<text x="30" y="1226" text-anchor="start" font-size="12">  radarModule.coreVoltage and</text>
<text x="30" y="1242" text-anchor="start" font-size="12">  radarIoBuck.outputVoltage ==</text>
<text x="30" y="1258" text-anchor="start" font-size="12">  radarModule.ioVoltage} ✓</text>
<polyline points="20,1268 320,1268" fill="none" stroke="#000000"/>
<text x="170" y="1289" text-anchor="middle" font-size="11" font-style="italic">ports</text>
<text x="30" y="1305" text-anchor="start" font-size="12" font-style="italic">^ble:BlePort</text>
<text x="30" y="1321" text-anchor="start" font-size="12" font-style="italic">^mount:SeatpostMount</text>
<text x="30" y="1337" text-anchor="start" font-size="12" font-style="italic">^radar:RadarPort</text>
<text x="30" y="1353" text-anchor="start" font-size="12" font-style="italic">^rearLight:LightPort</text>
<text x="30" y="1369" text-anchor="start" font-size="12" font-style="italic">^usbC:UsbCPort</text>
<polyline points="20,1379 320,1379" fill="none" stroke="#000000"/>
<text x="170" y="1400" text-anchor="middle" font-size="11" font-style="italic">parts</text>
<text x="30" y="1416" text-anchor="start" font-size="12" font-style="italic">^battery:LowTemperaturePouchCell</text>
<text x="30" y="1432" text-anchor="start" font-size="12" font-style="italic">^button:Button</text>
<text x="30" y="1448" text-anchor="start" font-size="12" font-style="italic">^clamp:SeatpostClamp</text>
<text x="30" y="1464" text-anchor="start" font-size="12" font-style="italic">^enclosure:Enclosure</text>
<text x="30" y="1480" text-anchor="start" font-size="12" font-style="italic">^ledDriver:LedDriver</text>
<text x="30" y="1496" text-anchor="start" font-size="12" font-style="italic">^leds:RearLeds</text>
<text x="30" y="1512" text-anchor="start" font-size="12" font-style="italic">^mcu:Mcu</text>
<text x="30" y="1528" text-anchor="start" font-size="12" font-style="italic">^powerManager:PowerManager</text>
<text x="30" y="1544" text-anchor="start" font-size="12" font-style="italic">^radarCoreBuck:RadarCoreBuck</text>
<text x="30" y="1560" text-anchor="start" font-size="12" font-style="italic">^radarIoBuck:RadarIoBuck</text>
<text x="30" y="1576" text-anchor="start" font-size="12" font-style="italic">^radarModule:Awrl6432Radar</text>
<text x="30" y="1592" text-anchor="start" font-size="12" font-style="italic">^usbCReceptacle:UsbCReceptacle</text>
<polyline points="20,1602 320,1602" fill="none" stroke="#000000"/>
<text x="170" y="1623" text-anchor="middle" font-size="11" font-style="italic">requirements</text>
<text x="30" y="1639" text-anchor="start" font-size="12">satisfy detectionRange ✓</text>
<text x="30" y="1655" text-anchor="start" font-size="12">satisfy alertLatency ✓</text>
<text x="30" y="1671" text-anchor="start" font-size="12">satisfy trackedVehicles ✓</text>
<text x="30" y="1687" text-anchor="start" font-size="12">satisfy closingSpeed ✓</text>
<text x="30" y="1703" text-anchor="start" font-size="12">satisfy rangeResolution ✓</text>
<text x="30" y="1719" text-anchor="start" font-size="12">satisfy speedResolution ✓</text>
<text x="30" y="1735" text-anchor="start" font-size="12">satisfy daylightVisibility ✓</text>
<text x="30" y="1751" text-anchor="start" font-size="12">satisfy totalMass ✓</text>
<text x="30" y="1767" text-anchor="start" font-size="12">satisfy seatpostFit ✓</text>
<text x="30" y="1783" text-anchor="start" font-size="12">satisfy runtimeNightSolid ✓</text>
<text x="30" y="1799" text-anchor="start" font-size="12">satisfy runtimeDayFlash ✓</text>
<text x="30" y="1815" text-anchor="start" font-size="12">satisfy chargeTime ✓</text>
<text x="30" y="1831" text-anchor="start" font-size="12">satisfy operatingTemperature ✓</text>
<text x="30" y="1847" text-anchor="start" font-size="12">satisfy radioEmissions ✓</text>
</svg>
