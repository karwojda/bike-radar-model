<text x="339" y="619" text-anchor="start" font-size="12">  ledDriver.nightSolidPower +</text>
<text x="339" y="635" text-anchor="start" font-size="12">  leds.nightSolidPower</text>
<text x="339" y="651" text-anchor="start" font-size="12" font-style="italic">^radarEirp = radarModule.eirp</text>
<text x="339" y="667" text-anchor="start" font-size="12" font-style="italic">^radarMaxEirp = radarModule.bandMaxEirp</text>
