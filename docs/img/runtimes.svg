<text x="339" y="283" text-anchor="start" font-size="12">  TiltedDetectionRange(radarModule,</text>
<text x="339" y="299" text-anchor="start" font-size="12">  radarModule.designTargetRcs,</text>
<text x="339" y="315" text-anchor="start" font-size="12">  worstCaseTilt)</text>
<text x="339" y="331" text-anchor="start" font-size="12" font-style="italic">^mass = radarModule.mass + mcu.mass +</text>
