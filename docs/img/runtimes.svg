<text x="339" y="1066" text-anchor="start" font-size="12">  mcu.alertLatency} ✓</text>
<text x="339" y="1082" text-anchor="start" font-size="12" font-style="italic">^{nightSolidPower &lt;=</text>
<text x="339" y="1098" text-anchor="start" font-size="12">  battery.maxDischargePower} ✓</text>
<text x="339" y="1114" text-anchor="start" font-size="12" font-style="italic">^{mcu.peakCurrent &lt;=</text>
<text x="339" y="1130" text-anchor="start" font-size="12">  powerManager.mcuRailMaxCurrent} ✓</text>
<text x="339" y="1146" text-anchor="start" font-size="12" font-style="italic">^{radarModule.corePeakCurrent &lt;=</text>
<text x="339" y="1162" text-anchor="start" font-size="12">  radarCoreBuck.maxOutputCurrent and</text>
<text x="339" y="1178" text-anchor="start" font-size="12">  radarModule.ioPeakCurrent &lt;=</text>
<text x="339" y="1194" text-anchor="start" font-size="12">  radarIoBuck.maxOutputCurrent} ✓</text>
<text x="339" y="1210" text-anchor="start" font-size="12" font-style="italic">^{radarCoreBuck.outputVoltage ==</text>
<text x="339" y="1226" text-anchor="start" font-size="12">  radarModule.coreVoltage and</text>
<text x="339" y="1242" text-anchor="start" font-size="12">  radarIoBuck.outputVoltage ==</text>
<text x="339" y="1258" text-anchor="start" font-size="12">  radarModule.ioVoltage} ✓</text>
