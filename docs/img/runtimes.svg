<text x="479" y="91" text-anchor="middle" font-size="11" font-style="italic">attributes</text>
<text x="339" y="107" text-anchor="start" font-size="12" font-style="italic">^alertLatency = mcu.alertLatency</text>
<text x="339" y="123" text-anchor="start" font-size="12" font-style="italic">^chargeTime = Runtime(battery.energy,</text>
<text x="339" y="139" text-anchor="start" font-size="12">  powerManager.chargePower) *</text>
<text x="339" y="155" text-anchor="start" font-size="12">  powerManager.constantVoltageStretch</text>
<text x="339" y="171" text-anchor="start" font-size="12" font-style="italic">^dayFlashPower:PowerValue =</text>
<text x="339" y="187" text-anchor="start" font-size="12">  radarOnlyPower + leds.dayFlashPower /</text>
<text x="339" y="203" text-anchor="start" font-size="12">  ledDriver.efficiency</text>
<text x="339" y="219" text-anchor="start" font-size="12" font-style="italic">^daylightVisibility =</text>
<text x="339" y="235" text-anchor="start" font-size="12">  leds.daylightVisibility</text>
<text x="339" y="251" text-anchor="start" font-size="12" font-style="italic">^detectionRange =</text>
<text x="339" y="267" text-anchor="start" font-size="12">  TiltedDetectionRange(radarModule,</text>
<text x="339" y="283" text-anchor="start" font-size="12">  radarModule.designTargetRcs,</text>
<text x="339" y="299" text-anchor="start" font-size="12">  worstCaseTilt)</text>
<text x="339" y="315" text-anchor="start" font-size="12" font-style="italic">^mass = radarModule.mass + mcu.mass +</text>
<text x="339" y="331" text-anchor="start" font-size="12">  button.mass + ledDriver.mass +</text>
<text x="339" y="347" text-anchor="start" font-size="12">  leds.mass + radarCoreBuck.mass +</text>
<text x="339" y="363" text-anchor="start" font-size="12">  radarIoBuck.mass + battery.mass +</text>
<text x="339" y="379" text-anchor="start" font-size="12">  powerManager.mass +</text>
<text x="339" y="395" text-anchor="start" font-size="12">  usbCReceptacle.mass + enclosure.mass +</text>
<text x="339" y="411" text-anchor="start" font-size="12">  clamp.mass</text>
<text x="339" y="427" text-anchor="start" font-size="12" font-style="italic">^maxClosingSpeed =</text>
<text x="339" y="443" text-anchor="start" font-size="12">  radarModule.maxClosingSpeed</text>
<text x="339" y="459" text-anchor="start" font-size="12" font-style="italic">^maxOperatingTemperature =</text>
<text x="339" y="475" text-anchor="start" font-size="12">  battery.maxDischargeTemperature</text>
<text x="339" y="491" text-anchor="start" font-size="12" font-style="italic">^maxSeatpostDiameter = clamp.maxDiameter</text>
<text x="339" y="507" text-anchor="start" font-size="12" font-style="italic">^maxTrackedVehicles =</text>
<text x="339" y="523" text-anchor="start" font-size="12">  mcu.maxTrackedVehicles</text>
<text x="339" y="539" text-anchor="start" font-size="12" font-style="italic">^minOperatingTemperature =</text>
<text x="339" y="555" text-anchor="start" font-size="12">  battery.minDischargeTemperature</text>
<text x="339" y="571" text-anchor="start" font-size="12" font-style="italic">^minSeatpostDiameter = clamp.minDiameter</text>
<text x="339" y="587" text-anchor="start" font-size="12" font-style="italic">^nightSolidPower:PowerValue =</text>
<text x="339" y="603" text-anchor="start" font-size="12">  radarOnlyPower + leds.nightSolidPower</text>
<text x="339" y="619" text-anchor="start" font-size="12">  / ledDriver.efficiency</text>
<text x="339" y="635" text-anchor="start" font-size="12" font-style="italic">^radarEirp = radarModule.eirp</text>
<text x="339" y="651" text-anchor="start" font-size="12" font-style="italic">^radarMaxEirp = radarModule.bandMaxEirp</text>
<text x="339" y="667" text-anchor="start" font-size="12" font-style="italic">^radarMaxOutputPower =</text>
<text x="339" y="683" text-anchor="start" font-size="12">  radarModule.bandMaxOutputPower</text>
<text x="339" y="699" text-anchor="start" font-size="12" font-style="italic">^radarOnlyPower:PowerValue =</text>
<text x="339" y="715" text-anchor="start" font-size="12">  radarModule.power /</text>
<text x="339" y="731" text-anchor="start" font-size="12">  radarCoreBuck.efficiency + mcu.power /</text>
<text x="339" y="747" text-anchor="start" font-size="12">  powerManager.mcuRailEfficiency</text>
<text x="339" y="763" text-anchor="start" font-size="12" font-style="italic">^radarOutputPower = radarModule.txPower</text>
<text x="339" y="779" text-anchor="start" font-size="12" font-style="italic">^rangeResolution =</text>
<text x="339" y="795" text-anchor="start" font-size="12">  radarModule.rangeResolution</text>
<text x="339" y="811" text-anchor="start" font-size="12" font-style="italic">^riderSag:AngularMeasureValue default</text>
<text x="339" y="827" text-anchor="start" font-size="12">  2 ['°']</text>
<text x="339" y="843" text-anchor="start" font-size="12" font-style="italic">^runtimeDayFlash =</text>
<text x="339" y="859" text-anchor="start" font-size="12">  Runtime(battery.usableEnergy,</text>
<text x="339" y="875" text-anchor="start" font-size="12">  dayFlashPower)</text>
<text x="339" y="891" text-anchor="start" font-size="12" font-style="italic">^runtimeNightSolid =</text>
<text x="339" y="907" text-anchor="start" font-size="12">  Runtime(battery.usableEnergy,</text>
<text x="339" y="923" text-anchor="start" font-size="12">  nightSolidPower)</text>
<text x="339" y="939" text-anchor="start" font-size="12" font-style="italic">^speedResolution =</text>
<text x="339" y="955" text-anchor="start" font-size="12">  radarModule.speedResolution</text>
<text x="339" y="971" text-anchor="start" font-size="12" font-style="italic">^worstCaseTilt:AngularMeasureValue =</text>
<text x="339" y="987" text-anchor="start" font-size="12">  clamp.aimError + clamp.slipAngle +</text>
<text x="339" y="1003" text-anchor="start" font-size="12">  riderSag</text>
