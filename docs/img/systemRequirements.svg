<text x="5901.5" y="253" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="5736" y="269" text-anchor="start" font-size="12">Alert the head unit within 0.5 s of</text>
<text x="5736" y="285" text-anchor="start" font-size="12">first detection.</text>
<polyline points="5726,295 6077,295" fill="none" stroke="#000000"/>
<text x="5901.5" y="316" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="5736" y="332" text-anchor="start" font-size="12">require {unit.alertLatency &lt;= 0.5 [second]}</text>
<rect x="5355" y="182" width="331" height="160" rx="10" fill="#d9ead3" stroke="#000000"/>
<text x="5520.5" y="204" text-anchor="middle" font-size="12">«requirement»</text>
<text x="5520.5" y="222" text-anchor="middle" font-size="14">&lt;S7&gt; chargeTime:SystemRequirement</text>
<rect x="5665" y="187" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="5673" y="198.67" text-anchor="middle" font-size="11">✓</text>
<polyline points="5355,232 5686,232" fill="none" stroke="#000000"/>
<text x="5520.5" y="253" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="5365" y="269" text-anchor="start" font-size="12">Charge from empty to full in 3 h or less</text>
<text x="5365" y="285" text-anchor="start" font-size="12">over USB-C.</text>
<polyline points="5355,295 5686,295" fill="none" stroke="#000000"/>
<text x="5520.5" y="316" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="5365" y="332" text-anchor="start" font-size="12">require {unit.chargeTime &lt;= 3 [hour]}</text>
<rect x="4876" y="174" width="439" height="176" rx="10" fill="#d9ead3" stroke="#000000"/>
