<text x="2150" y="253" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="1980" y="269" text-anchor="start" font-size="12">Run at least 16 h with radar on and the</text>
<text x="1980" y="285" text-anchor="start" font-size="12">light flashing.</text>
