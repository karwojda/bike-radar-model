<text x="784" y="285" text-anchor="start" font-size="12">35 mm in diameter.</text>
<polyline points="774,295 1515,295" fill="none" stroke="#000000"/>
<text x="1144.5" y="316" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="784" y="332" text-anchor="start" font-size="12">require {unit.minSeatpostDiameter &lt;= 25 [millimetre] and unit.maxSeatpostDiameter &gt;= 35 [millimetre]}</text>
<rect x="421" y="190" width="313" height="144" rx="10" fill="#d9ead3" stroke="#000000"/>
