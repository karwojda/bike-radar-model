<text x="4204" y="180" text-anchor="middle" font-size="12">«requirement»</text>
<text x="4204" y="198" text-anchor="middle" font-size="14">&lt;S1&gt; detectionRange:SystemRequirement</text>
<rect x="4362" y="163" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
