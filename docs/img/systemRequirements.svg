<text x="5095.5" y="245" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="4886" y="261" text-anchor="start" font-size="12">Measure closing speeds up to 120 km/h: a</text>
<text x="4886" y="277" text-anchor="start" font-size="12">car at 120 km/h behind a rider who has</text>
<text x="4886" y="293" text-anchor="start" font-size="12">stopped.</text>
<polyline points="4876,303 5315,303" fill="none" stroke="#000000"/>
<text x="5095.5" y="324" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="4886" y="340" text-anchor="start" font-size="12">require {unit.maxClosingSpeed &gt;= 120 [kilometre / hour]}</text>
<rect x="4423" y="182" width="412" height="160" rx="10" fill="#d9ead3" stroke="#000000"/>
