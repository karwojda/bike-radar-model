<text x="4204" y="229" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="4035" y="245" text-anchor="start" font-size="12">Detect an approaching car at 140 m or</text>
<text x="4035" y="261" text-anchor="start" font-size="12">more, however the unit sits on any</text>
<text x="4035" y="277" text-anchor="start" font-size="12">seatpost it fits. Smaller vehicles, such</text>
<text x="4035" y="293" text-anchor="start" font-size="12">as motorbikes, are detected later and</text>
<text x="4035" y="309" text-anchor="start" font-size="12">have no range requirement yet.</text>
<polyline points="4025,319 4383,319" fill="none" stroke="#000000"/>
<text x="4204" y="340" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="4035" y="356" text-anchor="start" font-size="12">require {unit.detectionRange &gt;= 140 [metre]}</text>
<rect x="3601" y="205" width="384" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
