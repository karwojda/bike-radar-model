<text x="2381" y="277" text-anchor="start" font-size="12">Work from -10 °C to 40 °C.</text>
<polyline points="2371,287 3562,287" fill="none" stroke="#000000"/>
<text x="2966.5" y="308" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="2381" y="324" text-anchor="start" font-size="12">require {unit.minOperatingTemperature &lt;= -10 [degree celsius (temperature difference)] and unit.maxOperatingTemperature &gt;= 40 [degree celsius (temperature difference)]}</text>
<rect x="1970" y="182" width="360" height="160" rx="10" fill="#d9ead3" stroke="#000000"/>
