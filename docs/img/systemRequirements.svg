<text x="3793" y="276" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="3611" y="292" text-anchor="start" font-size="12">Rated IP67: dust-tight, and survives</text>
<text x="3611" y="308" text-anchor="start" font-size="12">immersion to 1 m for 30 min.</text>
<rect x="2371" y="190" width="1191" height="144" rx="10" fill="#d9ead3" stroke="#000000"/>
<text x="2966.5" y="212" text-anchor="middle" font-size="12">«requirement»</text>
