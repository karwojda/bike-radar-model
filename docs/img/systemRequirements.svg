<text x="5901.5" y="245" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="5736" y="261" text-anchor="start" font-size="12">Alert the head unit within 0.5 s of</text>
<text x="5736" y="277" text-anchor="start" font-size="12">first detection.</text>
<polyline points="5726,287 6077,287" fill="none" stroke="#000000"/>
<text x="5901.5" y="308" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="5736" y="324" text-anchor="start" font-size="12">require {unit.alertLatency &lt;= 0.5 [second]}</text>
<rect x="5355" y="174" width="331" height="160" rx="10" fill="#d9ead3" stroke="#000000"/>
<text x="5520.5" y="196" text-anchor="middle" font-size="12">«requirement»</text>
<text x="5520.5" y="214" text-anchor="middle" font-size="14">&lt;S7&gt; chargeTime:SystemRequirement</text>
