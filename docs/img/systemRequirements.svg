<text x="3237" y="107" text-anchor="start" font-size="12">The rear unit's system requirements.</text>
<rect x="5726" y="174" width="351" height="160" rx="10" fill="#d9ead3" stroke="#000000"/>
<text x="5901.5" y="196" text-anchor="middle" font-size="12">«requirement»</text>
<text x="5901.5" y="214" text-anchor="middle" font-size="14">&lt;S2&gt; alertLatency:SystemRequirement</text>
<rect x="6056" y="179" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
