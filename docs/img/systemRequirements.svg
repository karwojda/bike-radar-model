<text x="1144.5" y="222" text-anchor="middle" font-size="14">&lt;S9&gt; seatpostFit:SystemRequirement</text>
<rect x="1494" y="187" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1502" y="198.67" text-anchor="middle" font-size="11">✓</text>
