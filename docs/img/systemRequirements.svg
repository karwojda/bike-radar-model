<text x="5520.5" y="245" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="5365" y="261" text-anchor="start" font-size="12">Charge from empty to full in 3 h or less</text>
<text x="5365" y="277" text-anchor="start" font-size="12">over USB-C.</text>
<polyline points="5355,287 5686,287" fill="none" stroke="#000000"/>
<text x="5520.5" y="308" text-anchor="middle" font-size="11" font-style="italic">constraints</text>
<text x="5365" y="324" text-anchor="start" font-size="12">require {unit.chargeTime &lt;= 3 [hour]}</text>
