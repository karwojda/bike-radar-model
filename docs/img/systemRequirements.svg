<text x="5095.5" y="237" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="4886" y="253" text-anchor="start" font-size="12">Measure closing speeds up to 120 km/h: a</text>
<text x="4886" y="269" text-anchor="start" font-size="12">car at 120 km/h behind a rider who has</text>
<text x="4886" y="285" text-anchor="start" font-size="12">stopped.</text>
