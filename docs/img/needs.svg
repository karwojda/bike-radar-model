<svg xmlns="http://www.w3.org/2000/svg" width="574" height="1051" viewBox="0 0 574 1051" font-family="sans-serif">
<rect x="0" y="0" width="574" height="1051" fill="#ffffff"/>
<polygon points="185.5,133 179.5,142 185.5,151 191.5,142" fill="#000000" stroke="#000000"/>
<polyline points="185.5,151 185.5,974.5" fill="none" stroke="#000000"/>
<polyline points="185.5,199 210,199" fill="none" stroke="#000000"/>
<polyline points="185.5,265 210,265" fill="none" stroke="#000000"/>
<polyline points="185.5,361.5 210,361.5" fill="none" stroke="#000000"/>
<polyline points="185.5,482.5 210,482.5" fill="none" stroke="#000000"/>
<polyline points="185.5,603.5 209,603.5" fill="none" stroke="#000000"/>
<polyline points="185.5,732.5 209,732.5" fill="none" stroke="#000000"/>
<polyline points="185.5,853.5 209,853.5" fill="none" stroke="#000000"/>
<polyline points="185.5,974.5 209,974.5" fill="none" stroke="#000000"/>
<rect x="20" y="20" width="331" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="185.5" y="42" text-anchor="middle" font-size="12">«requirement»</text>
<text x="185.5" y="60" text-anchor="middle" font-size="14">riderNeeds:StakeholderNeed</text>
<text x="185.5" y="76" text-anchor="middle" font-size="12">subject unit</text>
<rect x="330" y="25" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="338" y="36.67" text-anchor="middle" font-size="11">○</text>
<polyline points="20,86 351,86" fill="none" stroke="#000000"/>
<text x="185.5" y="107" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="30" y="123" text-anchor="start" font-size="12">What the rider needs from the rear unit.</text>
<rect x="210" y="174" width="120" height="50" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="270" y="196" text-anchor="middle" font-size="12">«part»</text>
<text x="270" y="214" text-anchor="middle" font-size="14">unit</text>
<rect x="210" y="240" width="120" height="50" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="270" y="262" text-anchor="middle" font-size="12">«part»</text>
<text x="270" y="280" text-anchor="middle" font-size="14">rider:Rider</text>
<rect x="210" y="305" width="318" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="369" y="327" text-anchor="middle" font-size="12">«requirement»</text>
<text x="369" y="345" text-anchor="middle" font-size="14">&lt;N1&gt; awareness:StakeholderNeed</text>
<rect x="507" y="310" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="515" y="321.67" text-anchor="middle" font-size="11">○</text>
<polyline points="210,355 528,355" fill="none" stroke="#000000"/>
<text x="369" y="376" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="220" y="392" text-anchor="start" font-size="12">I know a vehicle is coming from behind</text>
<text x="220" y="408" text-anchor="start" font-size="12">before I can hear it.</text>
<rect x="210" y="434" width="274" height="97" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="347" y="456" text-anchor="middle" font-size="12">«requirement»</text>
<text x="347" y="474" text-anchor="middle" font-size="14">&lt;N2&gt; beSeen:StakeholderNeed</text>
<rect x="463" y="439" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="471" y="450.67" text-anchor="middle" font-size="11">○</text>
<polyline points="210,484 484,484" fill="none" stroke="#000000"/>
<text x="347" y="505" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="220" y="521" text-anchor="start" font-size="12">Drivers see me, day and night.</text>
<rect x="209" y="547" width="331" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="374.5" y="569" text-anchor="middle" font-size="12">«requirement»</text>
<text x="374.5" y="587" text-anchor="middle" font-size="14">&lt;N3&gt; lastsTheRide:StakeholderNeed</text>
<rect x="519" y="552" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="527" y="563.67" text-anchor="middle" font-size="11">○</text>
<polyline points="209,597 540,597" fill="none" stroke="#000000"/>
<text x="374.5" y="618" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="219" y="634" text-anchor="start" font-size="12">It lasts a long day's ride and recharges</text>
<text x="219" y="650" text-anchor="start" font-size="12">overnight.</text>
<rect x="209" y="676" width="345" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="381.5" y="698" text-anchor="middle" font-size="12">«requirement»</text>
<text x="381.5" y="716" text-anchor="middle" font-size="14">&lt;N4&gt; unnoticedOnBike:StakeholderNeed</text>
<rect x="533" y="681" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="541" y="692.67" text-anchor="middle" font-size="11">○</text>
<polyline points="209,726 554,726" fill="none" stroke="#000000"/>
<text x="381.5" y="747" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="219" y="763" text-anchor="start" font-size="12">I don't notice its weight, and it fits</text>
<text x="219" y="779" text-anchor="start" font-size="12">my bike.</text>
<rect x="209" y="805" width="331" height="97" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="374.5" y="827" text-anchor="middle" font-size="12">«requirement»</text>
<text x="374.5" y="845" text-anchor="middle" font-size="14">&lt;N5&gt; allWeather:StakeholderNeed</text>
<rect x="519" y="810" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="527" y="821.67" text-anchor="middle" font-size="11">○</text>
<polyline points="209,855 540,855" fill="none" stroke="#000000"/>
<text x="374.5" y="876" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="219" y="892" text-anchor="start" font-size="12">It keeps working in rain, cold and heat.</text>
<rect x="209" y="918" width="337" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="377.5" y="940" text-anchor="middle" font-size="12">«requirement»</text>
<text x="377.5" y="958" text-anchor="middle" font-size="14">&lt;N6&gt; legalOnTheRoad:StakeholderNeed</text>
<rect x="525" y="923" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="533" y="934.67" text-anchor="middle" font-size="11">○</text>
<polyline points="209,968 546,968" fill="none" stroke="#000000"/>
<text x="377.5" y="989" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="219" y="1005" text-anchor="start" font-size="12">I can use it on the road anywhere in</text>
<text x="219" y="1021" text-anchor="start" font-size="12">Europe.</text>
</svg>
