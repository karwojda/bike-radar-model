<text x="890.5" y="42" text-anchor="middle" font-size="12">«requirement»</text>
<text x="890.5" y="60" text-anchor="middle" font-size="14">riderNeeds:StakeholderNeed</text>
<text x="890.5" y="76" text-anchor="middle" font-size="12">subject @1</text>
<rect x="1035" y="25" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1043" y="36.67" text-anchor="middle" font-size="11">○</text>
<polyline points="725,86 1056,86" fill="none" stroke="#000000"/>
<text x="890.5" y="107" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="735" y="123" text-anchor="start" font-size="12">What the rider needs from the rear unit.</text>
<rect x="1768" y="181" width="331" height="97" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="1933.5" y="203" text-anchor="middle" font-size="12">«requirement»</text>
<text x="1933.5" y="221" text-anchor="middle" font-size="14">&lt;N5&gt; allWeather:StakeholderNeed</text>
<rect x="2078" y="186" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="2086" y="197.67" text-anchor="middle" font-size="11">○</text>
<polyline points="1768,231 2099,231" fill="none" stroke="#000000"/>
<text x="1933.5" y="252" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="1778" y="268" text-anchor="start" font-size="12">It keeps working in rain, cold and heat.</text>
<rect x="1411" y="173" width="318" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="1570" y="195" text-anchor="middle" font-size="12">«requirement»</text>
<text x="1570" y="213" text-anchor="middle" font-size="14">&lt;N1&gt; awareness:StakeholderNeed</text>
<rect x="1708" y="178" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1716" y="189.67" text-anchor="middle" font-size="11">○</text>
<polyline points="1411,223 1729,223" fill="none" stroke="#000000"/>
<text x="1570" y="244" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="1421" y="260" text-anchor="start" font-size="12">I know a vehicle is coming from behind</text>
<text x="1421" y="276" text-anchor="start" font-size="12">before I can hear it.</text>
<rect x="1097" y="181" width="274" height="97" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="1234" y="203" text-anchor="middle" font-size="12">«requirement»</text>
<text x="1234" y="221" text-anchor="middle" font-size="14">&lt;N2&gt; beSeen:StakeholderNeed</text>
<rect x="1350" y="186" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1358" y="197.67" text-anchor="middle" font-size="11">○</text>
<polyline points="1097,231 1371,231" fill="none" stroke="#000000"/>
<text x="1234" y="252" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="1107" y="268" text-anchor="start" font-size="12">Drivers see me, day and night.</text>
<rect x="725" y="173" width="331" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="890.5" y="195" text-anchor="middle" font-size="12">«requirement»</text>
<text x="890.5" y="213" text-anchor="middle" font-size="14">&lt;N3&gt; lastsTheRide:StakeholderNeed</text>
<rect x="1035" y="178" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1043" y="189.67" text-anchor="middle" font-size="11">○</text>
<polyline points="725,223 1056,223" fill="none" stroke="#000000"/>
<text x="890.5" y="244" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="735" y="260" text-anchor="start" font-size="12">It lasts a long day's ride and recharges</text>
<text x="735" y="276" text-anchor="start" font-size="12">overnight.</text>
<rect x="566" y="205" width="120" height="50" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="626" y="227" text-anchor="middle" font-size="12">«part»</text>
<text x="626" y="245" text-anchor="middle" font-size="14">rider:Rider</text>
<rect x="406" y="205" width="120" height="50" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="466" y="227" text-anchor="middle" font-size="12">«part»</text>
<text x="466" y="245" text-anchor="middle" font-size="14">unit</text>
<rect x="20" y="173" width="345" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="192.5" y="195" text-anchor="middle" font-size="12">«requirement»</text>
<text x="192.5" y="213" text-anchor="middle" font-size="14">&lt;N4&gt; unnoticedOnBike:StakeholderNeed</text>
<rect x="344" y="178" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="352" y="189.67" text-anchor="middle" font-size="11">○</text>
<polyline points="20,223 365,223" fill="none" stroke="#000000"/>
<text x="192.5" y="244" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="30" y="260" text-anchor="start" font-size="12">I don't notice its weight, and it fits</text>
<text x="30" y="276" text-anchor="start" font-size="12">my bike.</text>
