<text x="887.5" y="42" text-anchor="middle" font-size="12">«requirement»</text>
<text x="887.5" y="60" text-anchor="middle" font-size="14">riderNeeds:StakeholderNeed</text>
<rect x="1032" y="25" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1040" y="36.67" text-anchor="middle" font-size="11">○</text>
<polyline points="722,70 1053,70" fill="none" stroke="#000000"/>
<text x="887.5" y="91" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="732" y="107" text-anchor="start" font-size="12">What the rider needs from the rear unit.</text>
<rect x="1608" y="165" width="331" height="97" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="1773.5" y="187" text-anchor="middle" font-size="12">«requirement»</text>
<text x="1773.5" y="205" text-anchor="middle" font-size="14">&lt;N5&gt; allWeather:StakeholderNeed</text>
<rect x="1918" y="170" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1926" y="181.67" text-anchor="middle" font-size="11">○</text>
<polyline points="1608,215 1939,215" fill="none" stroke="#000000"/>
<text x="1773.5" y="236" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="1618" y="252" text-anchor="start" font-size="12">It keeps working in rain, cold and heat.</text>
<rect x="1251" y="157" width="318" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="1410" y="179" text-anchor="middle" font-size="12">«requirement»</text>
<text x="1410" y="197" text-anchor="middle" font-size="14">&lt;N1&gt; awareness:StakeholderNeed</text>
<rect x="1548" y="162" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1556" y="173.67" text-anchor="middle" font-size="11">○</text>
<polyline points="1251,207 1569,207" fill="none" stroke="#000000"/>
<text x="1410" y="228" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="1261" y="244" text-anchor="start" font-size="12">I know a vehicle is coming from behind</text>
<text x="1261" y="260" text-anchor="start" font-size="12">before I can hear it.</text>
<rect x="937" y="165" width="274" height="97" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="1074" y="187" text-anchor="middle" font-size="12">«requirement»</text>
<text x="1074" y="205" text-anchor="middle" font-size="14">&lt;N2&gt; beSeen:StakeholderNeed</text>
<rect x="1190" y="170" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="1198" y="181.67" text-anchor="middle" font-size="11">○</text>
<polyline points="937,215 1211,215" fill="none" stroke="#000000"/>
<text x="1074" y="236" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="947" y="252" text-anchor="start" font-size="12">Drivers see me, day and night.</text>
<rect x="565" y="157" width="331" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="730.5" y="179" text-anchor="middle" font-size="12">«requirement»</text>
<text x="730.5" y="197" text-anchor="middle" font-size="14">&lt;N3&gt; lastsTheRide:StakeholderNeed</text>
<rect x="875" y="162" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="883" y="173.67" text-anchor="middle" font-size="11">○</text>
<polyline points="565,207 896,207" fill="none" stroke="#000000"/>
<text x="730.5" y="228" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="575" y="244" text-anchor="start" font-size="12">It lasts a long day's ride and recharges</text>
<text x="575" y="260" text-anchor="start" font-size="12">overnight.</text>
<rect x="406" y="189" width="120" height="50" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="466" y="211" text-anchor="middle" font-size="12">«part»</text>
<text x="466" y="229" text-anchor="middle" font-size="14">rider:Rider</text>
<rect x="20" y="157" width="345" height="113" rx="10" fill="#ffffff" stroke="#000000"/>
<text x="192.5" y="179" text-anchor="middle" font-size="12">«requirement»</text>
<text x="192.5" y="197" text-anchor="middle" font-size="14">&lt;N4&gt; unnoticedOnBike:StakeholderNeed</text>
<rect x="344" y="162" width="16" height="16" rx="8" fill="none" stroke="#000000"/>
<text x="352" y="173.67" text-anchor="middle" font-size="11">○</text>
<polyline points="20,207 365,207" fill="none" stroke="#000000"/>
<text x="192.5" y="228" text-anchor="middle" font-size="11" font-style="italic">doc</text>
<text x="30" y="244" text-anchor="start" font-size="12">I don't notice its weight, and it fits</text>
<text x="30" y="260" text-anchor="start" font-size="12">my bike.</text>
